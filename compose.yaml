name: smarthire
services:
  postgres:
    image: postgres:16.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  clamav:
    image: clamav/clamav:1.4_base@sha256:aeac907bb9445b12c1dd76f9283415272d8dcd596d402245ed13729d7181bb8a
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/smarthire/clamav-entrypoint.sh"]
    environment:
      CLAMD_STARTUP_TIMEOUT_SECONDS: "1800"
      CLAMD_RESTART_DELAY_SECONDS: "60"
      FRESHCLAM_CHECKS_PER_DAY: "12"
    group_add:
      - "101"
    volumes:
      - clamav_signatures:/var/lib/clamav
      - clamav_runtime:/run/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - ./infra/clamav/entrypoint.sh:/opt/smarthire/clamav-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf health > /tmp/.clamd-health && clamdscan --config-file=/etc/clamav/clamd.conf --no-summary /tmp/.clamd-health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
    tmpfs:
      - /tmp:size=64m,mode=1777
  cv-worker:
    build:
      context: .
      dockerfile: web/Dockerfile.cv-worker
    image: smarthire-cv-worker:local
    restart: unless-stopped
    env_file:
      - .env
      - web/.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CV_WORKER_POSTGRES_DB:-${POSTGRES_DB}}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CV_WORKER_POSTGRES_DB:-${POSTGRES_DB}}?schema=public
      CV_WORKER_ENABLED: ${CV_WORKER_ENABLED:-true}
      CV_STORAGE_LOCAL_ROOT: /app/.local/cv-storage
      CV_STORAGE_DOCKER_BIND_MOUNT: "true"
      CV_CLAMD_SOCKET_PATH: /run/clamav/clamd.sock
      # Local-only fallback while the official mirror's newest signatures are
      # older than the normal 24-hour policy. Non-local env validation still
      # requires 24 hours.
      CV_CLAMD_SIGNATURE_MAX_AGE_HOURS: "48"
      OCR_ENGINE_ENABLED: ${OCR_ENGINE_ENABLED:-true}
      OCR_ENGINE_SOCKET_PATH: /run/smarthire-ocr/ocr.sock
      OCR_ENGINE_NAME: ${OCR_ENGINE_NAME:-paddleocr-onnx}
      OCR_ENGINE_VERSION: ${OCR_ENGINE_VERSION:-1.1.0}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-PP-OCRv6-medium}
      OCR_MODEL_SHA256: ${OCR_MODEL_SHA256:-a8f8b2e10b1870bd35f1ec7a160399f5d4c6a6c6326c373abf01d7fdc9e38bba}
      # Server environment validation is shared with image search. Keep this
      # container-local path absolute without mounting image-search storage into
      # the purpose-isolated CV worker.
      IMAGE_SEARCH_STORAGE_LOCAL_ROOT: /app/.local/image-search-storage
    command:
      [
        "node",
        "--conditions=react-server",
        "--import",
        "tsx",
        "scripts/run-cv-worker.mjs",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    group_add:
      - "101"
      - "102"
    volumes:
      - ./web/.local/cv-storage:/app/.local/cv-storage
      - clamav_runtime:/run/clamav
      - ocr_runtime:/run/smarthire-ocr
    tmpfs:
      - /tmp:size=64m,mode=1777
  ocr-engine:
    build:
      context: .
      dockerfile: Dockerfile.ocr-engine
    image: smarthire-ocr-engine:local
    restart: unless-stopped
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      OCR_ENGINE_SOCKET_PATH: /run/smarthire-ocr/ocr.sock
      OCR_MODEL_MANIFEST_PATH: /app/model-manifest.json
      OCR_MODEL_ROOT: /opt/models
      OCR_SEARCH_ADAPTIVE_TILING_ENABLED: ${OCR_SEARCH_ADAPTIVE_TILING_ENABLED:-false}
      OCR_SEARCH_TILE_OVERLAP_PERCENT: ${OCR_SEARCH_TILE_OVERLAP_PERCENT:-15}
      OCR_SEARCH_TILE_BATCH_SIZE: ${OCR_SEARCH_TILE_BATCH_SIZE:-2}
      OCR_SEARCH_MAX_TILES: ${OCR_SEARCH_MAX_TILES:-4}
      OCR_SEARCH_STRATEGY_VERSION: ${OCR_SEARCH_STRATEGY_VERSION:-search-ocr-adaptive-tiles-v1}
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 4.0
    mem_limit: 8g
    volumes:
      - ocr_runtime:/run/smarthire-ocr
    tmpfs:
      - /tmp:size=512m,mode=1770,uid=10001,gid=102
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
  image-search-worker:
    build:
      context: .
      dockerfile: Dockerfile.image-search-worker
    image: smarthire-image-search-worker:local
    restart: unless-stopped
    env_file:
      - .env
      - web/.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      IMAGE_SEARCH_WORKER_ENABLED: ${IMAGE_SEARCH_WORKER_ENABLED:-true}
      IMAGE_SEARCH_CLEANUP_ENABLED: ${IMAGE_SEARCH_CLEANUP_ENABLED:-true}
      IMAGE_SEARCH_INTERPRETER: ${IMAGE_SEARCH_INTERPRETER:-openai}
      IMAGE_SEARCH_OPENAI_ENABLED: ${IMAGE_SEARCH_OPENAI_ENABLED:-true}
      IMAGE_SEARCH_STORAGE_LOCAL_ROOT: /app/.local/image-search-storage
      IMAGE_SEARCH_STORAGE_DOCKER_BIND_MOUNT: "true"
      # Server environment validation is shared with CV import. Keep this
      # container-local path absolute without mounting CV storage into the
      # purpose-isolated image-search worker.
      CV_STORAGE_LOCAL_ROOT: /app/.local/cv-storage
      CV_CLAMD_SOCKET_PATH: /run/clamav/clamd.sock
      CV_CLAMD_SIGNATURE_MAX_AGE_HOURS: "48"
      OCR_ENGINE_SOCKET_PATH: /run/smarthire-ocr/ocr.sock
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      ocr-engine:
        condition: service_started
        required: false
    group_add:
      - "101"
      - "102"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 2.0
    mem_limit: 1g
    volumes:
      - ./web/.local/image-search-storage:/app/.local/image-search-storage
      - clamav_runtime:/run/clamav
      - ocr_runtime:/run/smarthire-ocr
    tmpfs:
      - /tmp:size=128m,mode=1770,uid=1000,gid=1000
  admin-worker:
    build:
      context: .
      dockerfile: Dockerfile.admin-worker
    image: smarthire-admin-worker:local
    restart: unless-stopped
    env_file:
      - .env
      - web/.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_WORKER_ENABLED: ${ADMIN_WORKER_ENABLED:-true}
      # The shared local env file contains a Windows host path. The worker
      # runs in Linux, so keep validation and any accidental access container-local.
      CV_STORAGE_LOCAL_ROOT: /app/.local/cv-storage
      IMAGE_SEARCH_STORAGE_LOCAL_ROOT: /app/.local/image-search-storage
      ADMIN_EVIDENCE_STORAGE_ROOT: /app/.local/admin-evidence
      ADMIN_CLAMD_SOCKET_PATH: /run/clamav/clamd.sock
      GOOGLE_DRIVE_BACKUP_CLIENT_PATH: /app/SmartHireBackup/client_secret_649331580707-cq8m0cp497p5a584bevi311n0ikn9b9h.apps.googleusercontent.com.json
      GOOGLE_DRIVE_BACKUP_TOKEN_PATH: /app/SmartHireBackup/google-oauth-token.json
      CV_CLAMD_SIGNATURE_MAX_AGE_HOURS: "48"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    group_add:
      - "101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./web/.private-admin-evidence:/app/.local/admin-evidence
      - ./SmartHireBackup:/app/SmartHireBackup:ro
      - clamav_runtime:/run/clamav
    tmpfs:
      - /tmp:size=128m,mode=1770,uid=1000,gid=1000
volumes:
  postgres_data:
  clamav_signatures:
  clamav_runtime:
  ocr_runtime:
