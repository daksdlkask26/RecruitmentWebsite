name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smarthire
          POSTGRES_PASSWORD: smarthire
          POSTGRES_DB: smarthire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smarthire -d smarthire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://smarthire:smarthire@localhost:5432/smarthire_test
      DIRECT_URL: postgresql://smarthire:smarthire@localhost:5432/smarthire_test
      TOKEN_SECRET: ci-only-token-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-thirty-two-characters
      CANDIDATE_ORIGIN: http://localhost:3001
      ADMIN_ORIGIN: http://console.admin.localhost:3001
      RECRUITER_ORIGIN: http://console.recruiter.localhost:3001
      ADMIN_EVIDENCE_STORAGE_ADAPTER: filesystem
      ADMIN_EVIDENCE_STORAGE_ROOT: /tmp/smarthire-admin-evidence
      ADMIN_EVIDENCE_KEY_V1: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ADMIN_WORKER_ENABLED: "false"
      ADMIN_NOTIFICATION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrations:check
      - run: npm run db:deploy
      - run: npm run db:verify
      - run: npm run search:catalog:bootstrap --workspace @smarthire/web -- --apply
      - run: npm run admin:contracts --workspace @smarthire/web
      - run: npm run typecheck
      - run: npm run test:search --workspace @smarthire/web
      - run: npm run search:occupation:audit:catalog --workspace @smarthire/web -- --summary --limit-error-samples=20
      - run: npm run search:relevance --workspace @smarthire/web
      - run: npm run perf:search --workspace @smarthire/web
      - run: npm run search:canary:gate:self-test --workspace @smarthire/web
      - run: npm run lint:search --workspace @smarthire/web
      - run: npm run format:search --workspace @smarthire/web
      - run: npm run lint
      - run: git diff --check
      - run: npm run test:admin-management
      - run: npm run perf:admin-management:self-test
      - run: npm run test
      - run: npm run build
      - name: Install Chromium for Search browser gates
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/web/.local/playwright-browsers
        run: npx playwright install --with-deps chromium
      - name: Start production server for Search browser gates
        shell: bash
        run: |
          NODE_ENV=production PORT=3001 npm run start --workspace @smarthire/web > /tmp/smarthire-search-e2e.log 2>&1 &
          echo $! > /tmp/smarthire-search-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/smarthire-search-e2e.log
          exit 1
      - name: Run Search browser gates
        env:
          PLAYWRIGHT_REUSE_SERVER: "1"
          PLAYWRIGHT_PRODUCTION: "1"
        run: npm run test:search:e2e --workspace @smarthire/web
      - name: Run Admin Search lifecycle browser gate
        env:
          PLAYWRIGHT_REUSE_SERVER: "1"
          PLAYWRIGHT_PRODUCTION: "1"
        run: npm run test:search:e2e:admin --workspace @smarthire/web
      - name: Stop Search browser server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/smarthire-search-e2e.pid ]; then
            kill "$(cat /tmp/smarthire-search-e2e.pid)" || true
          fi
          if [ -f /tmp/smarthire-search-e2e.log ]; then
            tail -n 80 /tmp/smarthire-search-e2e.log || true
          fi
